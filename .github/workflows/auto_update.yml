name: Auto Update Toffee Streams

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Run Scraper Script
        run: |
          python update_toffee.py

      - name: Commit and Push Updated Files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "ShamimToffeeBot"
          git config --global user.email "bot@shamim.com"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
          git add toffee_channel_data.json toffee_playlist.m3u
          git diff --staged --quiet || (git commit -m "🔁 Auto update Toffee playlist" && git push origin HEAD:main)
